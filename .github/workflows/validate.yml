name: Validate N1 design system

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n1-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Offline validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate repository
        run: python3 scripts/validate_repository.py
      - name: Build local package (no upload)
        run: python3 scripts/package_n1_skill.py --zip
